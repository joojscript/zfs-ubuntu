---
# Give Docker its own dataset so container churn is excluded from OS rollback
# and snapshots. Non-fatal if the pool layout differs.
- name: Detect root pool
  ansible.builtin.shell: "set -o pipefail; findmnt -no SOURCE / | cut -d/ -f1"
  args:
    executable: /bin/bash
  register: docker_root_pool
  changed_when: false
  failed_when: false

- name: Create dedicated ZFS dataset for Docker
  ansible.builtin.command: >-
    zfs create -o mountpoint=/var/lib/docker
    -o com.sun:auto-snapshot=false
    {{ docker_root_pool.stdout }}/docker
  args:
    creates: /var/lib/docker
  when: docker_root_pool.stdout | length > 0
  failed_when: false

- name: Install Docker (Ubuntu docker.io package)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
