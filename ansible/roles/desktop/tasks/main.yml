---
- name: Resolve desktop profile
  ansible.builtin.set_fact:
    desktop_meta: "{{ desktop_profiles[desktop_selected].metapackage }}"
    desktop_dm: "{{ desktop_profiles[desktop_selected].display_manager }}"
    desktop_extras_effective: "{{ desktop_profiles[desktop_selected].extras }}"
  vars:
    desktop_selected: "{{ system.desktop | default('ubuntu') }}"

- name: Install the desktop metapackage and display manager
  ansible.builtin.apt:
    name:
      - "{{ desktop_meta }}"
      - "{{ desktop_dm }}"
      - network-manager
    state: present
    update_cache: true

- name: Install desktop extras
  ansible.builtin.apt:
    name: "{{ desktop_extras_effective }}"
    state: present
  when: desktop_extras_effective | length > 0

- name: Enable the display manager
  ansible.builtin.systemd:
    name: "{{ desktop_dm }}"
    enabled: true
  failed_when: false

- name: Let NetworkManager manage networking
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  failed_when: false

- name: Set graphical target as default
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: false
